apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.nowplayingwidget'
version = '1.0.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
if (expoModulesCorePlugin.exists()) {
  apply from: expoModulesCorePlugin
  applyKotlinExpoModulesCorePlugin()
}

// Pin to RNQP's Media3 (1.10.0) so the widget's MediaController shares the exact
// media3-session artifact the PlaybackService was built against — no version skew.
def media3Version = rootProject.ext.has("media3Version") ? rootProject.ext.get("media3Version") : "1.10.0"

android {
  namespace = "expo.modules.nowplayingwidget"

  compileSdk rootProject.ext.has("compileSdkVersion") ? rootProject.ext.get("compileSdkVersion") : 35

  defaultConfig {
    minSdk rootProject.ext.has("minSdkVersion") ? rootProject.ext.get("minSdkVersion") : 24
    targetSdk rootProject.ext.has("targetSdkVersion") ? rootProject.ext.get("targetSdkVersion") : 35
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = JavaVersion.VERSION_17.majorVersion
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation "androidx.media3:media3-session:${media3Version}"
  implementation "androidx.media3:media3-common:${media3Version}"
  implementation "androidx.core:core-ktx:1.13.1"
}
